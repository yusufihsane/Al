<!DOCTYPE html>

<html lang="tr">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shmart AI</title>

<meta name="description" content="Shmart AI — Akıllı yapay zeka asistanı.">

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

/* ==========================================
   RENKLER
========================================== */

:root {

    --bg: #07080d;
    --surface: #0d0f18;
    --border: #1a1d2e;

    --accent: #ff0055;
    --accent2: #ff4d84;

    --text: #e8eaf0;
    --muted: #4a4f6a;

    --user-bg: #160818;
    --ai-bg: #080d18;

    --glow: 0 0 20px #ff005540;

}


/* ==========================================
   GENEL
========================================== */

* {

    margin: 0;
    padding: 0;

    box-sizing: border-box;

}


html,
body {

    width: 100%;
    height: 100%;

}


body {

    background: var(--bg);

    color: var(--text);

    font-family: 'Rajdhani', sans-serif;

    overflow: hidden;

}


body::before {

    content: '';

    position: fixed;

    inset: 0;

    background-image:

        linear-gradient(
            var(--border) 1px,
            transparent 1px
        ),

        linear-gradient(
            90deg,
            var(--border) 1px,
            transparent 1px
        );

    background-size: 40px 40px;

    opacity: 0.3;

    pointer-events: none;

}


/* ==========================================
   ANA UYGULAMA
========================================== */

.app {

    width: 100%;
    height: 100vh;

    display: flex;

}


/* ==========================================
   SIDEBAR
========================================== */

.sidebar {

    width: 270px;

    height: 100vh;

    background:

        linear-gradient(
            180deg,
            #0b0c14,
            #06070b
        );

    border-right:

        1px solid var(--border);

    display: flex;

    flex-direction: column;

    padding: 16px;

    z-index: 20;

}


/* ==========================================
   SIDEBAR LOGO
========================================== */

.sidebar-logo {

    display: flex;

    align-items: center;

    gap: 10px;

    padding: 8px 4px 20px;

    border-bottom:

        1px solid var(--border);

}


.sidebar-logo-mark {

    width: 38px;
    height: 38px;

    border:

        2px solid var(--accent);

    border-radius: 9px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-family:

        'Share Tech Mono';

    font-size: 11px;

    color: var(--accent);

    box-shadow: var(--glow);

}


.sidebar-logo-text {

    display: flex;

    flex-direction: column;

}


.sidebar-logo-text h2 {

    font-size: 17px;

    letter-spacing: 3px;

}


.sidebar-logo-text h2 span {

    color: var(--accent);

}


.sidebar-logo-text p {

    color: var(--muted);

    font-size: 8px;

    letter-spacing: 1px;

    font-family:

        'Share Tech Mono';

}


/* ==========================================
   YENİ SOHBET
========================================== */

.new-chat-btn {

    width: 100%;

    margin-top: 18px;

    padding: 12px;

    border:

        1px solid var(--accent);

    border-radius: 10px;

    background:

        rgba(
            255,
            0,
            85,
            0.08
        );

    color: var(--text);

    cursor: pointer;

    font-family:

        'Rajdhani';

    font-size: 15px;

    font-weight: 600;

    letter-spacing: 1px;

    transition: .2s;

}


.new-chat-btn:hover {

    background:

        rgba(
            255,
            0,
            85,
            0.18
        );

    box-shadow:

        var(--glow);

}


/* ==========================================
   SOHBET BAŞLIK
========================================== */

.chat-title {

    margin-top: 22px;

    margin-bottom: 10px;

    padding-left: 5px;

    color: var(--muted);

    font-family:

        'Share Tech Mono';

    font-size: 10px;

    letter-spacing: 1px;

}


/* ==========================================
   SOHBET LİSTESİ
========================================== */

#chatList {

    flex: 1;

    overflow-y: auto;

    padding-right: 3px;

}


/* Scrollbar */

#chatList::-webkit-scrollbar {

    width: 4px;

}


#chatList::-webkit-scrollbar-thumb {

    background: var(--border);

    border-radius: 10px;

}


/* ==========================================
   SOHBET BLOĞU
========================================== */

.chat-item {

    width: 100%;

    display: flex;

    align-items: center;

    gap: 8px;

    padding: 11px 9px;

    margin-bottom: 5px;

    border-radius: 9px;

    cursor: pointer;

    transition: .2s;

    color: var(--muted);

}


.chat-item:hover {

    background: var(--surface);

    color: var(--text);

}


.chat-item.active {

    background:

        rgba(
            255,
            0,
            85,
            0.10
        );

    color: var(--text);

    border:

        1px solid #2a0f1f;

}


.chat-icon {

    font-size: 15px;

}


.chat-name {

    flex: 1;

    overflow: hidden;

    white-space: nowrap;

    text-overflow: ellipsis;

    font-size: 14px;

}


.delete-chat {

    background: transparent;

    border: none;

    color: var(--muted);

    cursor: pointer;

    font-size: 14px;

    opacity: 0;

    transition: .2s;

}


.chat-item:hover .delete-chat {

    opacity: 1;

}


.delete-chat:hover {

    color: var(--accent);

}


/* ==========================================
   SIDEBAR ALT
========================================== */

.sidebar-footer {

    padding-top: 12px;

    border-top:

        1px solid var(--border);

    color: var(--muted);

    text-align: center;

    font-family:

        'Share Tech Mono';

    font-size: 9px;

}


/* ==========================================
   ANA ALAN
========================================== */

.main {

    flex: 1;

    height: 100vh;

    display: flex;

    flex-direction: column;

    min-width: 0;

}


/* ==========================================
   HEADER
========================================== */

header {

    width: 100%;

    max-width: 820px;

    padding: 28px 24px 16px;

    margin: 0 auto;

    display: flex;

    align-items: center;

    gap: 14px;

    z-index: 10;

}


.logo-mark {

    width: 42px;
    height: 42px;

    border:

        2px solid var(--accent);

    border-radius: 10px;

    display: flex;

    align-items: center;

    justify-content: center;

    box-shadow:

        var(--glow);

    font-family:

        'Share Tech Mono';

    color: var(--accent);

    font-size: 13px;

}


.logo-text h1 {

    font-size: 22px;

    letter-spacing: 4px;

}


.logo-text h1 span {

    color: var(--accent);

}


.logo-text p {

    font-size: 10px;

    color: var(--accent);

    letter-spacing: 2px;

    font-family:

        'Share Tech Mono';

}


.status {

    margin-left: auto;

    display: flex;

    align-items: center;

    gap: 7px;

    font-size: 11px;

    color: var(--muted);

}


.status-dot {

    width: 8px;
    height: 8px;

    background: #00ff88;

    border-radius: 50%;

    box-shadow:

        0 0 8px #00ff88;

}


/* ==========================================
   CHAT
========================================== */

.chat-wrap {

    width: 100%;

    max-width: 820px;

    margin: 0 auto;

    flex: 1;

    display: flex;

    flex-direction: column;

    padding: 0 16px;

    overflow: hidden;

}


#messages {

    flex: 1;

    overflow-y: auto;

    padding: 10px;

    display: flex;

    flex-direction: column;

    gap: 16px;

}


#messages::-webkit-scrollbar {

    width: 5px;

}


#messages::-webkit-scrollbar-thumb {

    background: var(--border);

    border-radius: 10px;

}


/* ==========================================
   MESAJ
========================================== */

.msg {

    display: flex;

    gap: 12px;

    animation:

        fadeUp .3s ease;

}


.msg.user {

    flex-direction: row-reverse;

}


@keyframes fadeUp {

    from {

        opacity: 0;

        transform:
            translateY(10px);

    }

    to {

        opacity: 1;

        transform:
            translateY(0);

    }

}


/* ==========================================
   AVATAR
========================================== */

.avatar {

    width: 36px;
    height: 36px;

    border-radius: 8px;

    display: flex;

    align-items: center;

    justify-content: center;

    font-size: 10px;

    flex-shrink: 0;

}


.msg.user .avatar {

    border:

        1px solid var(--accent);

    color: var(--accent);

    background:

        var(--user-bg);

}


.msg.ai .avatar {

    border:

        1px solid #1a3a5c;

    color: #4d9fff;

    background:

        var(--ai-bg);

}


/* ==========================================
   MESAJ BALONU
========================================== */

.bubble {

    max-width: 75%;

    padding: 12px 16px;

    border-radius: 12px;

    font-size: 16px;

    line-height: 1.6;

    white-space: pre-wrap;

    word-break: break-word;

}


.msg.user .bubble {

    background:

        var(--user-bg);

    border:

        1px solid #2a0f1f;

}


.msg.ai .bubble {

    background:

        var(--ai-bg);

    border:

        1px solid var(--border);

}


/* ==========================================
   WELCOME
========================================== */

.welcome {

    text-align: center;

    padding: 70px 20px;

}


.welcome h2 {

    font-size: 38px;

    letter-spacing: 6px;

}


.welcome .accent {

    color: var(--accent);

}


.welcome p {

    color: var(--muted);

    margin-top: 10px;

    letter-spacing: 2px;

}


/* ==========================================
   INPUT
========================================== */

.input-area {

    width: 100%;

    max-width: 820px;

    margin: 0 auto;

    padding: 12px 16px 24px;

}


.input-box {

    display: flex;

    align-items: center;

    background:

        var(--surface);

    border:

        1px solid var(--border);

    border-radius: 14px;

    padding: 6px 8px;

    gap: 8px;

}


.input-box:focus-within {

    border-color:

        var(--accent);

    box-shadow:

        var(--glow);

}


/* ==========================================
   FOTOĞRAF VE DOSYA
========================================== */

.attach-btn {

    width: 38px;
    height: 38px;

    min-width: 38px;

    border: none;

    border-radius: 9px;

    background: transparent;

    color: var(--muted);

    font-size: 18px;

    cursor: pointer;

    transition: .2s;

}


.attach-btn:hover {

    background:

        var(--border);

    color:

        var(--accent);

    transform:

        scale(1.1);

}


/* ==========================================
   MESAJ INPUT
========================================== */

#input {

    flex: 1;

    min-width: 0;

    background: transparent;

    border: none;

    outline: none;

    color: var(--text);

    font-family:

        'Rajdhani';

    font-size: 16px;

    padding: 10px 0;

}


#input::placeholder {

    color:

        var(--muted);

}


/* ==========================================
   GÖNDER
========================================== */

#sendBtn {

    width: 44px;
    height: 44px;

    border: none;

    border-radius: 10px;

    background:

        var(--accent);

    color: white;

    cursor: pointer;

    font-size: 18px;

    box-shadow:

        var(--glow);

    transition: .2s;

}


#sendBtn:hover {

    background:

        var(--accent2);

    transform:

        scale(1.05);

}


#sendBtn:disabled {

    background:

        var(--muted);

    cursor:

        not-allowed;

}


/* ==========================================
   DOSYA BİLGİSİ
========================================== */

#dosyaBilgi {

    font-size: 12px;

    color:

        var(--accent);

    margin-top: 6px;

    padding-left: 10px;

}


/* ==========================================
   HINT
========================================== */

.hint {

    text-align: center;

    color:

        var(--muted);

    font-size: 11px;

    margin-top: 8px;

}


/* ==========================================
   MOBİL
========================================== */

@media (max-width: 700px) {

    .sidebar {

        position: fixed;

        left: -280px;

        transition: .3s;

    }

    .sidebar.open {

        left: 0;

    }

    .bubble {

        max-width: 85%;

    }

}


</style>

</head>

<script>


/* ==========================================
   ELEMENTLER
========================================== */

const input = document.getElementById(
    'input'
);


const msgs = document.getElementById(
    'messages'
);


const sendBtn = document.getElementById(
    'sendBtn'
);


const chatList = document.getElementById(
    'chatList'
);


/* ==========================================
   SOHBET VERİLERİ
========================================== */

let sohbetler = [];

let aktifSohbet = null;


/* ==========================================
   LOCAL STORAGE YÜKLE
========================================== */

function sohbetleriYukle() {


    const kayitliSohbetler = localStorage.getItem(
        "shmart_sohbetler"
    );


    const kayitliAktif = localStorage.getItem(
        "shmart_aktif_sohbet"
    );


    if (kayitliSohbetler) {


        sohbetler =
            JSON.parse(
                kayitliSohbetler
            );


    }


    if (kayitliAktif) {


        aktifSohbet =
            kayitliAktif;


    }


    if (sohbetler.length === 0) {


        yeniSohbet();


    }

    else {


        if (
            !aktifSohbet ||
            !sohbetBul(
                aktifSohbet
            )
        ) {


            aktifSohbet =
                sohbetler[0].id;


        }


        sohbetListesiniGuncelle();


        mesajlariYukle();


    }


}


/* ==========================================
   LOCAL STORAGE KAYDET
========================================== */

function sohbetleriKaydet() {


    localStorage.setItem(

        "shmart_sohbetler",

        JSON.stringify(
            sohbetler
        )

    );


    localStorage.setItem(

        "shmart_aktif_sohbet",

        aktifSohbet

    );


}


/* ==========================================
   SOHBET BUL
========================================== */

function sohbetBul(id) {


    return sohbetler.find(

        sohbet =>
            sohbet.id === id

    );


}


/* ==========================================
   YENİ SOHBET
========================================== */

function yeniSohbet() {


    const yeniID =

        "chat_" +

        Date.now() +

        "_" +

        Math.random()
        .toString(36)
        .substring(2, 7);


    const yeni = {


        id: yeniID,


        baslik:

            "Yeni Sohbet",


        mesajlar: []


    };


    sohbetler.unshift(
        yeni
    );


    aktifSohbet =
        yeniID;


    sohbetleriKaydet();


    sohbetListesiniGuncelle();


    mesajlariYukle();


    input.focus();


}


/* ==========================================
   SOHBET LİSTESİ
========================================== */

function sohbetListesiniGuncelle() {


    chatList.innerHTML = "";


    sohbetler.forEach(

        sohbet => {


            const div =
                document.createElement(
                    "div"
                );


            div.className =
                "chat-item";


            if (
                sohbet.id ===
                aktifSohbet
            ) {


                div.classList.add(
                    "active"
                );


            }


            div.innerHTML = `

                <div class="chat-icon">

                    💬

                </div>


                <div
                    class="chat-name"
                >

                    ${guvenliMetin(
                        sohbet.baslik
                    )}

                </div>


                <button
                    class="delete-chat"
                    title="Sohbeti sil"
                >

                    ✕
                    
                </button>

            `;


            div.onclick = function() {


                aktifSohbet =
                    sohbet.id;


                sohbetleriKaydet();


                sohbetListesiniGuncelle();


                mesajlariYukle();


            };


            const silBtn =
                div.querySelector(
                    ".delete-chat"
                );


            silBtn.onclick =
                function(e) {


                    e.stopPropagation();


                    sohbetSil(
                        sohbet.id
                    );


                };


            chatList.appendChild(
                div
            );


        }

    );


}


/* ==========================================
   SOHBET SİL
========================================== */

function sohbetSil(id) {


    const sohbet =
        sohbetBul(id);


    if (!sohbet) {

        return;

    }


    const onay =
        confirm(
            '"' +
            sohbet.baslik +
            '" sohbetini silmek istiyor musun?'
        );


    if (!onay) {

        return;

    }


    sohbetler =
        sohbetler.filter(

            sohbet =>
                sohbet.id !== id

        );


    if (
        aktifSohbet === id
    ) {


        if (
            sohbetler.length > 0
        ) {


            aktifSohbet =
                sohbetler[0].id;


        }

        else {


            aktifSohbet =
                null;


        }


    }


    if (
        sohbetler.length === 0
    ) {


        yeniSohbet();

        return;


    }


    sohbetleriKaydet();


    sohbetListesiniGuncelle();


    mesajlariYukle();


}


/* ==========================================
   MESAJLARI YÜKLE
========================================== */

function mesajlariYukle() {


    msgs.innerHTML = "";


    const sohbet =
        sohbetBul(
            aktifSohbet
        );


    if (!sohbet) {

        return;

    }


    if (
        sohbet.mesajlar.length === 0
    ) {


        welcomeEkle();

        return;

    }


    sohbet.mesajlar.forEach(

        mesaj => {


            mesajEkleDOM(

                mesaj.icerik,

                mesaj.tip

            );


        }

    );


    msgs.scrollTop =
        msgs.scrollHeight;


}


/* ==========================================
   WELCOME
========================================== */

function welcomeEkle() {


    const welcome =
        document.createElement(
            "div"
        );


    welcome.className =
        "welcome";


    welcome.innerHTML = `

        <h2>

            SHMART

            <span class="accent">

                AI

            </span>

        </h2>


        <p>

            Sana nasıl yardımcı olabilirim?

        </p>

    `;


    msgs.appendChild(
        welcome
    );


}


/* ==========================================
   MESAJ DOM EKLE
========================================== */

function mesajEkleDOM(
    icerik,
    tip
) {


    const div =
        document.createElement(
            'div'
        );


    div.className =
        `msg ${tip}`;


    const avatar =
        document.createElement(
            "div"
        );


    avatar.className =
        "avatar";


    avatar.textContent =
        tip === "user"
            ? "SEN"
            : "S·AI";


    const bubble =
        document.createElement(
            "div"
        );


    bubble.className =
        "bubble";


    bubble.innerHTML =
        icerik;


    div.appendChild(
        avatar
    );


    div.appendChild(
        bubble
    );


    msgs.appendChild(
        div
    );


}


/* ==========================================
   MESAJ EKLE VE KAYDET
========================================== */

function mesajEkle(
    icerik,
    tip
) {


    const welcome =
        document.querySelector(
            ".welcome"
        );


    if (welcome) {

        welcome.remove();

    }


    mesajEkleDOM(
        icerik,
        tip
    );


    const sohbet =
        sohbetBul(
            aktifSohbet
        );


    if (sohbet) {


        sohbet.mesajlar.push({

            icerik:

                icerik,

            tip:

                tip

        });


        /* İlk kullanıcı mesajı sohbet adı olsun */

        if (

            tip === "user" &&

            sohbet.mesajlar.length === 1

        ) {


            let baslik =
                icerik
                .replace(
                    /<br>/g,
                    " "
                )
                .replace(
                    /📎.*/g,
                    ""
                )
                .trim();


            if (
                baslik.length > 30
            ) {


                baslik =
                    baslik.substring(
                        0,
                        30
                    ) + "...";


            }


            if (
                baslik
            ) {


                sohbet.baslik =
                    baslik;


            }


        }


        sohbetleriKaydet();


        sohbetListesiniGuncelle();


    }


    msgs.scrollTop =
        msgs.scrollHeight;


}


/* ==========================================
   GÜVENLİ METİN
========================================== */

function guvenliMetin(text) {


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        text;


    return div.innerHTML;


}


/* ==========================================
   DOSYA SEÇİLDİ
========================================== */

function dosyaSecildi(
    inputElement
) {


    if (

        inputElement.files.length > 0

    ) {


        const dosya =
            inputElement.files[0];


        document
        .getElementById(
            "dosyaBilgi"
        )
        .innerText =

            "📎 Seçildi: " +

            dosya.name;


    }


}


/* ==========================================
   ENTER
========================================== */

input.addEventListener(
    'keydown',

    function(e) {


        if (
            e.key === 'Enter'
        ) {


            e.preventDefault();


            gonder();


        }


    }

);


/* ==========================================
   YAZIYOR
========================================== */

function typingEkle() {


    const div =
        document.createElement(
            'div'
        );


    div.className =
        'msg ai';


    div.innerHTML = `

        <div class="avatar">

            S·AI

        </div>


        <div class="bubble">

            🤖 Düşünüyorum...

        </div>

    `;


    msgs.appendChild(
        div
    );


    msgs.scrollTop =
        msgs.scrollHeight;


    return div;


}


/* ==========================================
   GÖNDER
========================================== */

async function gonder() {


    const soru =
        input.value.trim();


    const foto =
        document
        .getElementById(
            "fotoInput"
        )
        .files[0];


    const dosya =
        document
        .getElementById(
            "dosyaInput"
        )
        .files[0];


    const secilenDosya =
        foto || dosya;


    /* Boşsa gönderme */

    if (

        !soru &&

        !secilenDosya

    ) {

        return;

    }


    input.value = '';


    sendBtn.disabled =
        true;


    /* Kullanıcı mesajı */

    let kullaniciMesaji =
        guvenliMetin(
            soru
        );


    if (
        secilenDosya
    ) {


        kullaniciMesaji +=

            "<br>📎 " +

            guvenliMetin(
                secilenDosya.name
            );


    }


    mesajEkle(

        kullaniciMesaji,

        'user'

    );


    const typing =
        typingEkle();


    try {


        /* FORM */

        const formData =
            new FormData();


        formData.append(

            "soru",

            soru

        );


        /* DOSYA */

        if (
            secilenDosya
        ) {


            formData.append(

                "dosya",

                secilenDosya

            );


        }


        /* CHAT ID
           Şimdilik app.py kullanmıyor.
           Sonraki adımda hafıza için kullanılacak.
        */

        formData.append(

            "chat_id",

            aktifSohbet

        );


        /* FLASK */

        const res =
            await fetch(

                '/sor',

                {

                    method:
                        'POST',

                    body:
                        formData

                }

            );


        const text =
            await res.text();


        console.log(

            "FLASK CEVABI:",

            text

        );


        let data;


        try {


            data =
                JSON.parse(
                    text
                );


        }

        catch {


            throw new Error(

                text ||

                "Sunucudan geçersiz cevap geldi."

            );


        }


        if (
            !res.ok
        ) {


            throw new Error(

                data.cevap ||

                "Sunucu hatası: " +

                res.status

            );


        }


        typing.remove();


        /* AI CEVABI */

        mesajEkle(

            guvenliMetin(

                data.cevap ||

                "Bir cevap alınamadı."

            ),

            'ai'

        );


        /* DOSYALARI TEMİZLE */

        document
        .getElementById(
            "fotoInput"
        )
        .value = "";


        document
        .getElementById(
            "dosyaInput"
        )
        .value = "";


        document
        .getElementById(
            "dosyaBilgi"
        )
        .innerText = "";


    }


    catch (error) {


        typing.remove();


        mesajEkle(

            guvenliMetin(

                "❌ Hata: " +

                error.message

            ),

            'ai'

        );


        console.error(

            "GÖNDERME HATASI:",

            error

        );


    }


    sendBtn.disabled =
        false;


    input.focus();


}


/* ==========================================
   BAŞLAT
========================================== */

sohbetleriYukle();


</script>

</body>

</html>
