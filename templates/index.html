<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Shmart AI</title>

<meta name="description" content="Shmart AI — Akıllı yapay zeka asistanı.">

<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Rajdhani:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>

:root {
  --bg: #07080d;
  --surface: #0d0f18;
  --border: #1a1d2e;
  --accent: #ff0055;
  --accent2: #ff4d84;
  --text: #e8eaf0;
  --muted: #4a4f6a;
  --user-bg: #160818;
  --ai-bg: #080d18;
  --glow: 0 0 20px #ff005540;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

html,
body {
  width: 100%;
  height: 100%;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Rajdhani', sans-serif;
  display: flex;
  flex-direction: column;
  align-items: center;
  overflow: hidden;
}

body::before {
  content: '';
  position: fixed;
  inset: 0;

  background-image:
    linear-gradient(var(--border) 1px, transparent 1px),
    linear-gradient(90deg, var(--border) 1px, transparent 1px);

  background-size: 40px 40px;
  opacity: 0.3;

  pointer-events: none;
}

/* HEADER */

header {
  width: 100%;
  max-width: 820px;

  padding: 28px 24px 16px;

  display: flex;
  align-items: center;
  gap: 14px;

  z-index: 10;
}

.logo-mark {
  width: 42px;
  height: 42px;

  border: 2px solid var(--accent);
  border-radius: 10px;

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow: var(--glow);

  font-family: 'Share Tech Mono';
  color: var(--accent);
  font-size: 13px;
}

.logo-text h1 {
  font-size: 22px;
  letter-spacing: 4px;
}

.logo-text h1 span {
  color: var(--accent);
}

.logo-text p {
  font-size: 10px;
  color: var(--accent);
  letter-spacing: 2px;
  font-family: 'Share Tech Mono';
}

.status {
  margin-left: auto;

  display: flex;
  align-items: center;
  gap: 7px;

  font-size: 11px;
  color: var(--muted);
}

.status-dot {
  width: 8px;
  height: 8px;

  background: #00ff88;
  border-radius: 50%;

  box-shadow: 0 0 8px #00ff88;
}

/* CHAT */

.chat-wrap {
  width: 100%;
  max-width: 820px;

  flex: 1;

  display: flex;
  flex-direction: column;

  padding: 0 16px;

  overflow: hidden;
}

#messages {
  flex: 1;

  overflow-y: auto;

  padding: 10px;

  display: flex;
  flex-direction: column;

  gap: 16px;
}

.msg {
  display: flex;
  gap: 12px;

  animation: fadeUp .3s ease;
}

.msg.user {
  flex-direction: row-reverse;
}

@keyframes fadeUp {

  from {
    opacity: 0;
    transform: translateY(10px);
  }

  to {
    opacity: 1;
    transform: translateY(0);
  }

}

/* AVATAR */

.avatar {
  width: 36px;
  height: 36px;

  border-radius: 8px;

  display: flex;
  align-items: center;
  justify-content: center;

  font-size: 10px;

  flex-shrink: 0;
}

.msg.user .avatar {
  border: 1px solid var(--accent);
  color: var(--accent);
  background: var(--user-bg);
}

.msg.ai .avatar {
  border: 1px solid #1a3a5c;
  color: #4d9fff;
  background: var(--ai-bg);
}

/* MESAJ */

.bubble {
  max-width: 75%;

  padding: 12px 16px;

  border-radius: 12px;

  font-size: 16px;
  line-height: 1.6;

  white-space: pre-wrap;
  word-break: break-word;
}

.msg.user .bubble {
  background: var(--user-bg);
  border: 1px solid #2a0f1f;
}

.msg.ai .bubble {
  background: var(--ai-bg);
  border: 1px solid var(--border);
}

/* DOSYA ÖNİZLEME */

.file-preview {
  margin-top: 8px;

  padding: 8px 10px;

  border: 1px solid var(--border);
  border-radius: 8px;

  color: var(--accent);

  font-size: 13px;
}

/* WELCOME */

.welcome {
  text-align: center;
  padding: 70px 20px;
}

.welcome h2 {
  font-size: 38px;
  letter-spacing: 6px;
}

.welcome .accent {
  color: var(--accent);
}

.welcome p {
  color: var(--muted);
  margin-top: 10px;
  letter-spacing: 2px;
}

/* INPUT */

.input-area {
  width: 100%;
  max-width: 820px;

  padding: 12px 16px 24px;
}

.input-box {
  display: flex;
  align-items: center;

  background: var(--surface);

  border: 1px solid var(--border);
  border-radius: 14px;

  padding: 6px 8px;

  gap: 8px;
}

.input-box:focus-within {
  border-color: var(--accent);
  box-shadow: var(--glow);
}

/* DOSYA TUŞLARI */

.attach-btn {
  width: 38px;
  height: 38px;
  min-width: 38px;

  border: none;
  border-radius: 9px;

  background: transparent;

  color: var(--muted);

  font-size: 18px;

  cursor: pointer;

  transition: .2s;
}

.attach-btn:hover {
  background: var(--border);
  color: var(--accent);

  transform: scale(1.1);
}

/* INPUT */

#input {
  flex: 1;
  min-width: 0;

  background: transparent;

  border: none;
  outline: none;

  color: var(--text);

  font-family: 'Rajdhani';

  font-size: 16px;

  padding: 10px 0;
}

#input::placeholder {
  color: var(--muted);
}

/* SEND */

#sendBtn {
  width: 44px;
  height: 44px;

  border: none;
  border-radius: 10px;

  background: var(--accent);

  color: white;

  cursor: pointer;

  font-size: 18px;

  box-shadow: var(--glow);

  transition: .2s;
}

#sendBtn:hover {
  background: var(--accent2);
  transform: scale(1.05);
}

#sendBtn:disabled {
  background: var(--muted);
  cursor: not-allowed;
}

/* DOSYA BİLGİ */

#dosyaBilgi {
  font-size: 12px;

  color: var(--accent);

  margin-top: 6px;

  padding-left: 10px;
}

/* HINT */

.hint {
  text-align: center;

  color: var(--muted);

  font-size: 11px;

  margin-top: 8px;
}

</style>
</head>

<body>

<header>

  <div class="logo-mark">
    S·AI
  </div>

  <div class="logo-text">

    <h1>
      SHMART <span>AI</span>
    </h1>

    <p>
      POWERED BY GOOGLE GEMINI
    </p>

  </div>

  <div class="status">

    <div class="status-dot"></div>

    ONLINE

  </div>

</header>


<div class="chat-wrap">

  <div id="messages">

    <div class="welcome">

      <h2>
        SHMART <span class="accent">AI</span>
      </h2>

      <p>
        Sana nasıl yardımcı olabilirim?
      </p>

    </div>

  </div>

</div>


<div class="input-area">

  <div class="input-box">

    <!-- FOTOĞRAF -->

    <button
      class="attach-btn"
      onclick="document.getElementById('fotoInput').click()"
      title="Fotoğraf seç"
    >
      📷
    </button>


    <!-- DOSYA -->

    <button
      class="attach-btn"
      onclick="document.getElementById('dosyaInput').click()"
      title="Dosya seç"
    >
      📎
    </button>


    <!-- FOTOĞRAF INPUT -->

    <input
      type="file"
      id="fotoInput"
      accept="image/*"
      hidden
      onchange="dosyaSecildi(this)"
    >


    <!-- DOSYA INPUT -->

    <input
      type="file"
      id="dosyaInput"
      hidden
      onchange="dosyaSecildi(this)"
    >


    <!-- MESAJ -->

    <input
      id="input"
      type="text"
      placeholder="Mesajını yaz..."
      autocomplete="off"
      spellcheck="false"
    >


    <!-- GÖNDER -->

    <button
      id="sendBtn"
      onclick="gonder()"
    >
      ➤
    </button>

  </div>


  <div id="dosyaBilgi"></div>

  <p class="hint">
    ENTER ile gönder — GOOGLE GEMINI
  </p>

</div>


<script>

const input = document.getElementById('input');
const msgs = document.getElementById('messages');
const sendBtn = document.getElementById('sendBtn');

let ilk = true;


/* ENTER */

input.addEventListener('keydown', e => {

  if (e.key === 'Enter') {

    e.preventDefault();

    gonder();

  }

});


/* DOSYA SEÇİLDİ */

function dosyaSecildi(inputElement) {

  if (inputElement.files.length > 0) {

    const dosya = inputElement.files[0];

    document.getElementById("dosyaBilgi").innerText =
      "📎 Seçildi: " + dosya.name;

  }

}


/* MESAJ EKLE */

function mesajEkle(icerik, tip) {

  if (ilk) {

    document.querySelector('.welcome')?.remove();

    ilk = false;

  }

  const div = document.createElement('div');

  div.className = `msg ${tip}`;

  const avatar =
    tip === 'user'
      ? 'SEN'
      : 'S·AI';

  div.innerHTML = `

    <div class="avatar">
      ${avatar}
    </div>

    <div class="bubble">
      ${icerik}
    </div>

  `;

  msgs.appendChild(div);

  msgs.scrollTop = msgs.scrollHeight;

}


/* YAZIYOR */

function typingEkle() {

  const div = document.createElement('div');

  div.className = 'msg ai';

  div.innerHTML = `

    <div class="avatar">
      S·AI
    </div>

    <div class="bubble">
      🤖 Düşünüyorum...
    </div>

  `;

  msgs.appendChild(div);

  msgs.scrollTop = msgs.scrollHeight;

  return div;

}


/* GÖNDER */

async function gonder() {

  const soru = input.value.trim();

  const foto =
    document.getElementById("fotoInput").files[0];

  const dosya =
    document.getElementById("dosyaInput").files[0];

  const secilenDosya = foto || dosya;


  if (!soru && !secilenDosya) {
    return;
  }


  input.value = '';

  sendBtn.disabled = true;


  /* KULLANICI MESAJI */

  let kullaniciMesaji = soru;


  if (secilenDosya) {

    kullaniciMesaji +=
      "<br>📎 " + secilenDosya.name;

  }


  mesajEkle(
    kullaniciMesaji,
    'user'
  );


  const typing = typingEkle();


  try {

    /* FORM OLUŞTUR */

    const formData = new FormData();


    formData.append(
      "soru",
      soru
    );


    /* DOSYA VARSA EKLE */

    if (secilenDosya) {

      formData.append(
        "dosya",
        secilenDosya
      );

    }


    /* FLASK */

    const res = await fetch(
      '/sor',
      {
        method: 'POST',
        body: formData
      }
    );


    const data = await res.json();


    typing.remove();


    /* AI CEVABI */

    mesajEkle(
      data.cevap || "Bir cevap alınamadı.",
      'ai'
    );


    /* DOSYALARI TEMİZLE */

    document.getElementById(
      "fotoInput"
    ).value = "";


    document.getElementById(
      "dosyaInput"
    ).value = "";


    document.getElementById(
      "dosyaBilgi"
    ).innerText = "";


  }

  catch (error) {

    typing.remove();

    mesajEkle(
      "❌ Bağlantı hatası oluştu.",
      'ai'
    );

    console.error(error);

  }


  sendBtn.disabled = false;

  input.focus();

}

</script>

</body>
</html>
